services:
  - type: worker
    name: telegram-file-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_FILE
        value: /var/data/data.json
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
